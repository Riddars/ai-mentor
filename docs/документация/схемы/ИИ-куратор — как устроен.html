<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ИИ-куратор — как устроен</title><style>body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}.note{padding:10px 16px;color:#475569;font-size:14px;border-bottom:1px solid #E2E8F0}</style></head><body><div class="note">ИИ-куратор — как устроен. Нажимайте на блоки с надписью «Подробнее →»; вернуться — кнопкой «← Общая схема» или стрелками над схемой.</div><div class="mxgraph" style="max-width:100%" data-mxgraph="{&quot;highlight&quot;: &quot;#4F46E5&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;pages zoom&quot;, &quot;toolbar-nohide&quot;: true, &quot;toolbar-position&quot;: &quot;top&quot;, &quot;lightbox&quot;: false, &quot;auto-fit&quot;: true, &quot;xml&quot;: &quot;&lt;mxfile host=\&quot;drawio\&quot; type=\&quot;device\&quot;&gt;&lt;diagram id=\&quot;p0\&quot; name=\&quot;Общая схема\&quot;&gt;&lt;mxGraphModel dx=\&quot;1640\&quot; dy=\&quot;1040\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1640\&quot; pageHeight=\&quot;1040\&quot; background=\&quot;#FFFFFF\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;c4\&quot; value=\&quot;ИИ-куратор · будет работать на сервере ИТМО (сейчас — пилот на тестовых проектах)\&quot; style=\&quot;rounded=1;arcSize=4;whiteSpace=wrap;html=1;dashed=1;dashPattern=6 4;fillColor=#F8FAFC;strokeColor=#94A3B8;strokeWidth=1.5;verticalAlign=top;align=left;spacingLeft=14;spacingTop=6;fontFamily=Helvetica;fontSize=15;fontStyle=1;fontColor=#334155;container=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;340\&quot; y=\&quot;210\&quot; width=\&quot;960\&quot; height=\&quot;650\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c1\&quot; value=\&quot;ИИ-куратор студенческих исследований\&quot; style=\&quot;text;html=1;whiteSpace=wrap;align=left;verticalAlign=top;fontFamily=Helvetica;fontSize=26;fontColor=#111827;fontStyle=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;22\&quot; width=\&quot;1300\&quot; height=\&quot;39.1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c2\&quot; value=\&quot;Зачем: методическую ошибку, допущенную в начале работы, сейчас замечают через месяцы, когда на ней уже построены выводы. Куратор указывает на неё в день изменения — в комментарии к pull request студента. Решения остаются за людьми. Нажмите на блок, чтобы узнать, как он устроен.\&quot; style=\&quot;text;html=1;whiteSpace=wrap;align=left;verticalAlign=top;fontFamily=Helvetica;fontSize=14;fontColor=#4B5563;fontStyle=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;62\&quot; width=\&quot;1560\&quot; height=\&quot;41.800000000000004\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f0\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#451A03&amp;quot;&amp;gt;Совещательный&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;замечания не мешают принять PR; задержка — только пока идёт разбор, до 30 минут&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFBEB;strokeColor=#D97706;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;115\&quot; width=\&quot;375\&quot; height=\&quot;74\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f1\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#451A03&amp;quot;&amp;gt;Видит весь проект&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;проверяет путь данных от загрузки до итоговых метрик, а не только изменения&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFBEB;strokeColor=#D97706;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;435\&quot; y=\&quot;115\&quot; width=\&quot;375\&quot; height=\&quot;74\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f2\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#451A03&amp;quot;&amp;gt;Помнит&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;замечание переходит из PR в PR, пока его не исправят или не снимут&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFBEB;strokeColor=#D97706;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;830\&quot; y=\&quot;115\&quot; width=\&quot;375\&quot; height=\&quot;74\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f3\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#451A03&amp;quot;&amp;gt;Осторожный&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;лучше промолчать о сомнительном, чем показать неверное&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFBEB;strokeColor=#D97706;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1225\&quot; y=\&quot;115\&quot; width=\&quot;375\&quot; height=\&quot;74\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c3\&quot; value=\&quot;ВХОД\&quot; style=\&quot;text;html=1;whiteSpace=wrap;align=left;verticalAlign=top;fontFamily=Helvetica;fontSize=13;fontColor=#64748B;fontStyle=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;220\&quot; width=\&quot;260\&quot; height=\&quot;21.55\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;in_student\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#431407&amp;quot;&amp;gt;Студент&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Ведёт проект в GitHub: код, данные, описание исследования и план. Каждое изменение — через pull request (PR); отвечает на замечания в комментариях.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFF7ED;strokeColor=#EA580C;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;250\&quot; width=\&quot;260\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;in_sup\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#431407&amp;quot;&amp;gt;Руководитель проекта&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Подключает проект, решает по спорным замечаниям, поправляет заметки куратора.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFF7ED;strokeColor=#EA580C;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;560\&quot; width=\&quot;260\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;UserObject label=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#1E1B4B&amp;quot;&amp;gt;1. Приём изменений&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Узнаёт о каждом PR и ответе студента и ставит работу в очередь.&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#4F46E5;margin-top:6px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Подробнее →&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;\&quot; link=\&quot;data:page/id,p1\&quot; tooltip=\&quot;\&quot; id=\&quot;b1\&quot;&gt;&lt;mxCell style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;370\&quot; y=\&quot;260\&quot; width=\&quot;270\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;UserObject label=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#1E1B4B&amp;quot;&amp;gt;2. Разбор изменений&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;ИИ-агент читает проект и ищет явные методические ошибки — с помощью языковой модели (5).&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#4F46E5;margin-top:6px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Подробнее →&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;\&quot; link=\&quot;data:page/id,p2\&quot; tooltip=\&quot;\&quot; id=\&quot;b2\&quot;&gt;&lt;mxCell style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;680\&quot; y=\&quot;260\&quot; width=\&quot;280\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;UserObject label=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#1E1B4B&amp;quot;&amp;gt;3. Замечания и диалог&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Замечание живёт, пока проблема не решена; студент может возразить.&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#4F46E5;margin-top:6px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Подробнее →&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;\&quot; link=\&quot;data:page/id,p3\&quot; tooltip=\&quot;\&quot; id=\&quot;b3\&quot;&gt;&lt;mxCell style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1000\&quot; y=\&quot;260\&quot; width=\&quot;270\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;mxCell id=\&quot;mem\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#064E3B&amp;quot;&amp;gt;Память проекта&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Замечания, заметки куратора об устройстве проекта, история разборов и решений. Каждый разбор начинается с неё — поэтому куратор помнит проект между PR.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#ECFDF5;strokeColor=#059669;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;370\&quot; y=\&quot;430\&quot; width=\&quot;900\&quot; height=\&quot;90\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;UserObject label=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#1E1B4B&amp;quot;&amp;gt;4. Полный обзор проекта&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Перечитывает проект целиком и обновляет память — тоже с помощью модели.&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#4F46E5;margin-top:6px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Подробнее →&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;\&quot; link=\&quot;data:page/id,p4\&quot; tooltip=\&quot;\&quot; id=\&quot;b4\&quot;&gt;&lt;mxCell style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;370\&quot; y=\&quot;560\&quot; width=\&quot;270\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;UserObject label=\&quot;&amp;lt;b style=&amp;quot;font-size:15px;color:#111827&amp;quot;&amp;gt;5. Языковая модель&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Внешний сервис: им пользуются разбор (2) и обзор (4). Сейчас — Selectel.&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;font-size:12px;color:#4F46E5;margin-top:6px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Подробнее →&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;\&quot; link=\&quot;data:page/id,p5\&quot; tooltip=\&quot;\&quot; id=\&quot;b5\&quot;&gt;&lt;mxCell style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F3F4F6;strokeColor=#6B7280;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;680\&quot; y=\&quot;560\&quot; width=\&quot;280\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;UserObje mp;quot;&amp;gt;1. GitHub сам сообщает куратору о новом изменении&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Повторное сообщение о том же изменении второй разбор не создаёт.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;156.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s1\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;2. Лишнее отсеивается&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Проект на паузе, автор не участник проекта, PR — черновик: проверка сразу «успех», без разбора. Черновик разберут, когда его переведут в «готов к ревью».&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;237.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s2\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;3. В PR появляется проверка «AI Curator — идёт разбор»&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Пока она идёт, PR принять нельзя — не дольше 30 минут.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;318.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s3\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;4. Работа ставится в очередь с паузой 10 секунд&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Если студент пришлёт ещё коммит, разбирается только последний.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;399.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;out\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#052E16&amp;quot;&amp;gt;Выход&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• задача в очереди на разбор&amp;lt;br&amp;gt;• проверка «идёт разбор» в PR&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F0FDF4;strokeColor=#16A34A;strokeWidth=1.6;verticalAlign=middle;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1160\&quot; y=\&quot;120\&quot; width=\&quot;300\&quot; height=\&quot;360\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;imp\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#451A03&amp;quot;&amp;gt;Важно&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• Пропущенные коммиты подбираются сами: раз в 10 минут куратор сверяет открытые PR с GitHub.&amp;lt;br&amp;gt;• Ответ студента в комментарии разбирается без паузы и без проверки — принять PR он не мешает.&amp;lt;br&amp;gt;• Репозиторий, не подключённый в панели, куратор не видит.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFBEB;strokeColor=#D97706;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;530\&quot; width=\&quot;960\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;par\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#111827&amp;quot;&amp;gt;Параметры&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• пауза перед разбором — 10 с&amp;lt;br&amp;gt;• сверка с GitHub — раз в 10 мин&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#9CA3AF;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1030\&quot; y=\&quot;530\&quot; width=\&quot;430\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c4\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=none;rounded=0;html=1;endArrow=block;endFill=1;strokeColor=#4B5563;strokeWidth=1.6;exitX=0.08;exitY=1;exitPerimeter=0;entryX=0.08;entryY=0;entryPerimeter=0;fontFamily=Helvetica;fontSize=11;fontColor=#1F2937;labelBackgroundColor=#FFFFFF;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;s0\&quot; target=\&quot;s1\&quot;&gt;&lt;mxGeometry x=\&quot;0.0\&quot; relative=\&quot;1\&quot; as=\&quot;geome nt=\&quot;1\&quot; source=\&quot;how\&quot; target=\&quot;out\&quot;&gt;&lt;mxGeometry x=\&quot;0.0\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;diagram id=\&quot;p2\&quot; name=\&quot;2. Разбор изменений\&quot;&gt;&lt;mxGraphModel dx=\&quot;1500\&quot; dy=\&quot;920\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1500\&quot; pageHeight=\&quot;920\&quot; background=\&quot;#FFFFFF\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;&lt;root&gt;&lt;mxCell id=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;&lt;mxCell id=\&quot;how\&quot; value=\&quot;Как работает\&quot; style=\&quot;rounded=1;arcSize=4;whiteSpace=wrap;html=1;dashed=1;dashPattern=6 4;fillColor=#F8FAFC;strokeColor=#94A3B8;strokeWidth=1.5;verticalAlign=top;align=left;spacingLeft=14;spacingTop=6;fontFamily=Helvetica;fontSize=15;fontStyle=1;fontColor=#334155;container=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;380\&quot; y=\&quot;110\&quot; width=\&quot;740\&quot; height=\&quot;580\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c1\&quot; value=\&quot;2. Разбор изменений\&quot; style=\&quot;text;html=1;whiteSpace=wrap;align=left;verticalAlign=top;fontFamily=Helvetica;fontSize=26;fontColor=#111827;fontStyle=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;24\&quot; width=\&quot;1200\&quot; height=\&quot;39.1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c2\&quot; value=\&quot;Найти явные методические ошибки, которые уже искажают или могут исказить результаты.\&quot; style=\&quot;text;html=1;whiteSpace=wrap;align=left;verticalAlign=top;fontFamily=Helvetica;fontSize=15;fontColor=#4B5563;fontStyle=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;64\&quot; width=\&quot;1220\&quot; height=\&quot;24.25\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;UserObject label=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#111827&amp;quot;&amp;gt;← Общая схема&amp;lt;/b&amp;gt;\&quot; link=\&quot;data:page/id,p0\&quot; tooltip=\&quot;\&quot; id=\&quot;back\&quot;&gt;&lt;mxCell style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#9CA3AF;strokeWidth=1.2;verticalAlign=middle;align=center;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1290\&quot; y=\&quot;24\&quot; width=\&quot;170\&quot; height=\&quot;44\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;mxCell id=\&quot;in\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#111827&amp;quot;&amp;gt;Вход&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• изменения в PR и его описание&amp;lt;br&amp;gt;• описание исследования и план работ&amp;lt;br&amp;gt;• память проекта: открытые замечания и заметки куратора&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F3F4F6;strokeColor=#6B7280;strokeWidth=1.6;verticalAlign=middle;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;120\&quot; width=\&quot;300\&quot; height=\&quot;560\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s0\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;1. ИИ-агент получает копию проекта&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;ИИ-агент — модель, которая сама открывает и читает файлы. Копия — на том коммите, который разбирается; читать может, менять — нет.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;156.0\&quot; width=\&quot;700\&quot; height=\&quot;94.8\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s1\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;2. Читает изменения, затем путь данных&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Откуда выборки, где разбиение, на чём подбираются параметры, где считаются метрики.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;260.8\&quot; width=\&quot;700\&quot; height=\&quot;94.8\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s2\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;3. Формулирует замечания&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Что не так, почему важно, где именно (файл и строки), как исправить.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quo ntFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1290\&quot; y=\&quot;24\&quot; width=\&quot;170\&quot; height=\&quot;44\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;/UserObject&gt;&lt;mxCell id=\&quot;in\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#111827&amp;quot;&amp;gt;Вход&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• проект подключён&amp;lt;br&amp;gt;• проект возобновлён после паузы&amp;lt;br&amp;gt;• кнопка в панели&amp;lt;br&amp;gt;• в проекте появились изменения, которых куратор не видел (например, внесённые без PR)&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F3F4F6;strokeColor=#6B7280;strokeWidth=1.6;verticalAlign=middle;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;120\&quot; width=\&quot;300\&quot; height=\&quot;360\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s0\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;1. ИИ-агент читает основную версию проекта целиком&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Описание исследования, план, путь данных от загрузки до итоговых метрик.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;156.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s1\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;2. Записывает заметки куратора о проекте&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Справка для следующих разборов: данные, код, путь данных, соглашения.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;237.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s2\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;3. Ищет крупные ошибки&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Новые замечания — только критичные и важные.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;318.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s3\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:14px;color:#1E1B4B&amp;quot;&amp;gt;4. Закрывает исправленное&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:12.5px;color:#374151;margin-top:4px&amp;quot;&amp;gt;Замечания, которые уже исправлены в основной версии.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#EEF2FF;strokeColor=#6366F1;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;400\&quot; y=\&quot;399.0\&quot; width=\&quot;700\&quot; height=\&quot;71.0\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;out\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#052E16&amp;quot;&amp;gt;Выход&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• заметки куратора — видны и правятся в панели&amp;lt;br&amp;gt;• issue «Обзор проекта» — одна страница в репозитории с итогом обзора, обновляется, а не множится&amp;lt;br&amp;gt;• новые и закрытые замечания&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#F0FDF4;strokeColor=#16A34A;strokeWidth=1.6;verticalAlign=middle;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1160\&quot; y=\&quot;120\&quot; width=\&quot;300\&quot; height=\&quot;360\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;imp\&quot; value=\&quot;&amp;lt;b style=&amp;quot;font-size:16px;color:#451A03&amp;quot;&amp;gt;Важно&amp;lt;/b&amp;gt;&amp;lt;div style=&amp;quot;font-size:13px;color:#374151;margin-top:4px&amp;quot;&amp;gt;• Заметки — справка, они не снимают замечаний.&amp;lt;br&amp;gt;• Руководитель может поправить заметки — куратор сохранит его формулировки, если код им не противоречит.&amp;lt;br&amp;gt;• Автоматически — не чаще раза в неделю на проект; кнопкой в панели — в любой момент.&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fillColor=#FFFBEB;strokeColor=#D97706;strokeWidth=1.6;verticalAlign=top;align=left;spacingLeft=10;spacingRight=10;spacingTop=4;fontFamily=Helvetica;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;530\&quot; width=\&quot;960\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;par\&quot
