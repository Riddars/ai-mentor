project: Lantern Survey
fictional: true
version: 3
description: Painted tiles and paper vanes in invented Velin
fields:
  sample_id:
    type: string
    description: Identifier printed on a card
    required: true
  day:
    type: date
    description: Imaginary observation date
    required: true
  station:
    type: string
    description: Cardboard station label
    required: true
  zone:
    type: category
    description: Placement zone
    required: true
  light_dial:
    type: integer
    description: Nine-step light scale with zero
    required: true
  breeze_dial:
    type: integer
    description: Five-step vane scale with zero
    required: true
  tile_count:
    type: integer
    description: Count of ceramic tiles
    required: true
  status:
    type: category
    description: Review state of a paper form
    required: true
